name: Skill Security Audit

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'plugins/**'
      - '.claude-plugin/**'
      - '.github/workflows/skill-security.yml'
      - '.github/scripts/skill_security*.py'
      - '.github/skill-security-scope.json'
      - 'docs/SKILL_SECURITY_SCOPE.md'
  pull_request:
    paths:
      - 'skills/**'
      - 'plugins/**'
      - '.claude-plugin/**'
      - '.github/workflows/skill-security.yml'
      - '.github/scripts/skill_security*.py'
      - '.github/skill-security-scope.json'
      - 'docs/SKILL_SECURITY_SCOPE.md'
  schedule:
    # Weekly scan every Monday 10:00 UTC — catches newly-published CVEs
    # even when skill files haven't changed (SkillSpector SC4 queries OSV.dev live)
    - cron: '0 10 * * 1'
  workflow_dispatch:

jobs:
  skillspector:
    # One job per skill so each report, finding and SARIF category stays separate.
    # The list below must match skills/ and .github/skill-security-scope.json (a unit test checks it).
    name: SkillSpector (${{ matrix.name }})
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: add-demo, path: skills/add-demo }
          - { name: agentic-seo, path: skills/agentic-seo }
          - { name: executive-review, path: skills/executive-review }
          - { name: prasad-portfolio, path: skills/prasad-portfolio }
          - { name: recruiter-review, path: skills/recruiter-review }
          - { name: redesign-portfolio, path: skills/redesign-portfolio }
          - { name: security-review, path: skills/security-review }
          - { name: self-heal, path: skills/self-heal }
          - { name: testing, path: skills/testing }
          - { name: evaluate-fit, path: plugins/prasad-profile/skills/evaluate-fit }
    permissions:
      # Required for uploading SARIF results to GitHub Security tab
      security-events: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install SkillSpector
        run: |
          pip install uv
          uv venv .venv
          source .venv/bin/activate
          # v2.12.0: keep scanner updates explicit and reviewable.
          uv pip install "skillspector @ git+https://github.com/NVIDIA/SkillSpector.git@c7958a3268d9498644b22edb75d0f051bbc8cbfc"
          echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - name: Test report gate
        run: python3 -B -m unittest discover -s .github/scripts -p 'skill_security_test.py' -v

      - name: Determine skill path
        id: skill-path
        env:
          MATRIX_PATH: ${{ matrix.path }}
        run: |
          python3 - <<'PY'
          import os, pathlib, sys
          sys.path.insert(0, '.github/scripts')
          from skill_security import resolve_skill
          value = os.environ['MATRIX_PATH']
          path = resolve_skill(pathlib.Path.cwd(), value)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'path={path.as_posix()}\n')
          PY

      - name: Run SkillSpector (static-only, no LLM key required)
        id: scan
        env:
          SKILL_PATH: ${{ steps.skill-path.outputs.path }}
        run: |
          # Capture findings/failure status without losing the report-upload steps.
          set +e
          skillspector scan "$SKILL_PATH" \
            --format sarif \
            --output skillspector-report.sarif \
            --no-llm --fail-on-incomplete
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Validate skill-only scope and enforce risk threshold
        if: always()
        env:
          SKILL_PATH: ${{ steps.skill-path.outputs.path }}
          SCAN_EXIT_CODE: ${{ steps.scan.outputs.exit_code }}
        run: |
          python3 -B .github/scripts/skill_security.py

      - name: Upload SARIF to GitHub Security tab
        if: always() && hashFiles('skillspector-upload.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: skillspector-upload.sarif
          category: skillspector-${{ matrix.name }}

      - name: Upload SARIF artifact (for download / governance page)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: skillspector-sarif-${{ matrix.name }}-${{ github.run_id }}
          path: |
            skillspector-report.sarif
            skillspector-upload.sarif
          if-no-files-found: error
          retention-days: 90

  # Single status for branch protection: the check name "SkillSpector Scan" is unchanged.
  skillspector-gate:
    name: SkillSpector Scan
    needs: skillspector
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Require every skill scan to pass
        env:
          RESULT: ${{ needs.skillspector.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "::error::At least one skill scan did not pass (result: $RESULT)."
            exit 1
          fi
